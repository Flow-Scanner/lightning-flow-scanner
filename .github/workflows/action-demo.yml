name: Scan Flows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan-flows:
    runs-on: ubuntu-latest
    permissions:
      contents: read           # Read flow files
      pull-requests: read      # List changed files in PR
      security-events: write   # Upload SARIF to Code Scanning
      actions: read            # Required to gather metadata for telemetry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lightning Flow Scan
        id: flowscanner
        uses: Flow-Scanner/lightning-flow-scanner@action-v3.7.4
        with:
          sarif-only: false
