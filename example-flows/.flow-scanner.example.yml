# Flow Scanner Configuration
# This file defines exceptions for demo flows to suppress expected violations

# Ignore the demo folder - these flows intentionally contain violations for demonstration
ignore:
  - "**/testing/**"

exceptions:
  # Action Call In A Loop
  Demo_Action_In_Loop:
    action-call-in-loop:
      - Create_Task_For_Account

  # DML Statement In A Loop
  Demo_DML_In_Loop:
    dml-in-loop:
      - createNewCase

  # Duplicate DML Operation
  Demo_Duplicate_DML:
    duplicate-dml:
      - mock_screen_2

  # Excessive Cyclomatic Complexity
  Demo_Complexity:
    excessive-cyclomatic-complexity:
      - "28"

  # Flow Naming Convention
  DemoBadName:
    invalid-naming-convention:
      - DemoBadName

  # Get Records Stores All Fields
  Demo_All_Fields:
    get-record-all-fields:
      - Get_Account_Record

  # Hardcoded Id
  Demo_Hardcoded_Id:
    hardcoded-id:
      - create_Test_Account

  # Hardcoded URL
  Demo_Hardcoded_Url:
    hardcoded-url:
      - Create_Case_With_URL

  # Inactive Flow
  Demo_Inactive:
    inactive-flow:
      - Draft

  # Invalid API Version
  Demo_Old_API_Version:
    invalid-api-version:
      - "49"

  # Missing Auto Layout
  Demo_No_Auto_Layout:
    missing-auto-layout:
      - FREE_FORM_CANVAS

  # Missing Fault Path
  Demo_No_Fault_Path:
    missing-fault-path:
      - log_call

  # Missing Flow Description
  Demo_No_Description:
    missing-flow-description:
      - "*"

  # Missing Null Handler
  Demo_No_Null_Check:
    missing-null-handler:
      - Get_User

  # Missing Trigger Order
  Demo_No_Trigger_Order:
    unspecified-trigger-order:
      - TriggerOrder

  # Recursive After Update
  Demo_Recursion:
    recursive-record-update:
      - Update_Account_Last_Modified_Info

  # SOQL Query In A Loop
  Demo_SOQL_In_Loop:
    soql-in-loop:
      - SOQL_Query_Example

  # Same Record Field Updates
  Demo_Same_Record_Update:
    same-record-field-updates:
      - Update_triggering_records

  # Unclear API Name
  Demo_Unclear_Names:
    unclear-api-naming:
      - Copy_1_of_mockscreen

  # Unreachable Element
  Demo_Unreachable:
    unreachable-element:
      - unused_assignment

  # Unsafe Running Context
  Demo_System_Mode:
    unsafe-running-context:
      - SystemModeWithoutSharing

  # Unused Variable
  Demo_Unused_Variable:
    unused-variable:
      - anUnusedVariable
